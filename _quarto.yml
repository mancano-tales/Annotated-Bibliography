project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - bibliography.qmd
    - method.qmd
    - notes.qmd
    - posts/**/*.qmd
    - "!posts/DeKadt-GrzymalaBusse2025-Slides*.qmd"
    - "!posts/Breen-Muller2020Incomplete.qmd"
    - "!posts/Dobbin-Schoonhoven2010.qmd"
    - "!posts/Gomes-etal2019.qmd"
    - "!posts/Moe-Wiborg2017.qmd"
    - "!posts/Sguissardi2008.qmd"

execute:
  freeze: false

description-meta: "A method-first collection of structured reading notes and critical analytical closures."
author-meta: "Tales Mançano"

website:
  title: "Annotated Bibliography"
  description: "Open-access annotated reading notes with a transparent method for reconstructing arguments and writing critical analytical closures."
  site-url: "https://mancano-tales.github.io/annotated-bibliography/"

  navbar:
    background: light
    left:
      - text: "← Tales Mançano"
        href: https://mancano-tales.github.io
        target: _blank
      - text: Bibliography
        href: bibliography.qmd
      - text: Method
        href: method.qmd
      - text: Concept notes
        href: notes.qmd

    right:
      - icon: github
        href: https://github.com/mancano-tales/annotated-bibliography
        target: _blank
      - text: "{{< fa brands bluesky >}}"
        href: https://bsky.app
        target: _blank

  page-navigation: true

  page-footer:
    left: "[Tales Mançano](https://mancano-tales.github.io) &copy; <script>document.write(new Date().getFullYear())</script> · Method-first reading notes"
    right:
      - icon: github
        href: https://github.com/mancano-tales/annotated-bibliography
        target: _blank

  search:
    location: navbar
    type: textbox

  reader-mode: true
  draft-mode: unlinked
  open-graph: true

bibliography: "references.bib"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    filters:
      - mancano-tales/tts-reader
    tts-reader-enabled: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    include-in-header: "files/includes/_academic.qmd"
